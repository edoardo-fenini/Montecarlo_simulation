# Esempio: i tre portafogli dell'analisi iniziale + MSCI World come benchmark.
# Copia questo file, cambia nome e titoli, e lancialo con:
#   python confronta.py --config configurazioni/mio_file.yaml

nome: esempio tre portafogli

capitale_iniziale: 5000        # euro investiti all'inizio
versamento_mensile: 0          # euro versati ogni mese (0 = nessuno)
orizzonte_anni: 15
orizzonti_intermedi: [5, 10]   # risultati mostrati anche a questi anni

rendimento_atteso:
  metodo: beta                 # beta | uguale | storico | personalizzato
  tasso_privo_rischio: 0.02    # 2% (metodo beta)
  premio_mercato: 0.04         # 4% (metodo beta)
  valore_uguale: 0.06          # 6% (metodo uguale)
  # personalizzato:            # (metodo personalizzato) un valore per portafoglio + benchmark
  #   Cyber security: 0.05
  #   benchmark: 0.06

n_simulazioni: 20000          # 20.000 = mediana stabile entro ±2% (per una prova veloce: 1000)
seed: 12345
ribilanciamento: annuale       # annuale | semestrale | trimestrale | mensile | mai
costo_ribilanciamento: 0.001   # 0,1% dell'importo movimentato

benchmark:
  nome: MSCI World (ETF)
  descrizione: iShares Core MSCI World UCITS ETF USD (Acc)
  ticker: IWDA.AS
  isin: IE00B4L5Y983
  ter: 0.002
  proxy_storico: "^990100-USD-STRD"   # indice MSCI World prima della nascita dell'ETF (2009)

moduli:
  stress_test: true
  rischio_singolo_titolo: true
  confronto_modelli: false     # lento
  analisi_C: false             # storia dal 1999 con proxy di settore
  verifica_convergenza: true   # "Le simulazioni bastano?": ripete il calcolo con 3 seed

# Facoltativo: settore per gli stress test (tech | finanza | altro), se quello automatico non ti convince
settori:
  AMZN: tech
  GOOGL: tech

portafogli:
  - nome: Cyber security
    titoli: [PANW, FTNT, FFIV, CHKP, CRWD, S, ZS]       # lista = pesi uguali
  - nome: Banche d'investimento / PE
    titoli: [GS, JPM, MS, BLK, BX, HSBC, UBS]
  - nome: Big tech USA
    titoli: {PLTR: 20, AAPL: 20, MSFT: 20, GOOGL: 20, AMZN: 20}   # pesi in %
