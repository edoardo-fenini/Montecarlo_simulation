# Configurazione del confronto tra portafogli. Modifica qui titoli e parametri.

capitale_iniziale: 5000        # euro investiti all'inizio
versamento_mensile: 0          # euro versati ogni mese (0 = solo investimento iniziale)
orizzonte_anni: 15
checkpoint_anni: [5, 10, 15]   # orizzonti per cui mostrare i risultati
n_simulazioni: 20000
seed: 12345
rendimento_atteso: 0.06        # rendimento annuo atteso (nominale, in EUR), uguale per tutti
blocco_medio_giorni: 20        # lunghezza media dei blocchi del bootstrap
costo_ribilanciamento: 0.001   # 0,1% dell'importo movimentato a ogni ribilanciamento annuale
giorni_anno: 252

cambio: "EURUSD=X"             # dollari per 1 euro (Yahoo, dal 2003); prima: FRED DEXUSEU

benchmark:
  nome: "iShares Core MSCI World UCITS ETF USD (Acc)"
  ticker: "IWDA.AS"            # quotato in EUR su Euronext Amsterdam, dati dal 25/09/2009
  isin: "IE00B4L5Y983"
  ter: 0.0020
  proxy_storico: "^990100-USD-STRD"   # indice MSCI World Net in USD (prima del 2009)

# Periodi di analisi
analisi:
  A: {descrizione: "Periodo comune (tutti i titoli quotati)", inizio: "auto"}
  B: {descrizione: "Periodo lungo dal 2007 (titoli disponibili a ogni data)", inizio: "2007-01-01"}
  C: {descrizione: "Dal 1999 con proxy per i titoli non ancora quotati", inizio: "1999-01-04"}

# Proxy usati solo nell'analisi C per gli anni in cui un titolo non esisteva
proxy_settore:
  cyber: XLK
  bancari: XLF
  tech: XLK

portafogli:
  cyber:
    nome: "Cyber security"
    proxy: XLK
    titoli: {PANW: "Palo Alto Networks", FTNT: Fortinet, FFIV: F5, CHKP: "Check Point", CRWD: CrowdStrike, S: SentinelOne, ZS: Zscaler}
  finanza:
    nome: "Investment banking / asset mgmt / PE"
    proxy: XLF
    titoli: {GS: "Goldman Sachs", JPM: "JPMorgan", MS: "Morgan Stanley", BLK: BlackRock, BX: Blackstone, HSBC: "HSBC (ADR)", UBS: "UBS (NYSE)"}
  bigtech:
    nome: "Big tech USA"
    proxy: XLK
    titoli: {PLTR: Palantir, AAPL: Apple, MSFT: Microsoft, GOOGL: Alphabet, AMZN: Amazon}

# Robustezza: rendimenti attesi diversi per settore (scenario prudente).
# Motivazione: cyber e big tech partono da valutazioni elevate (rapporti prezzo/utili alti), quindi
# ipotizzo rendimenti futuri più bassi; i finanziari hanno valutazioni più basse e restano al 6%.
rendimenti_settoriali: {cyber: 0.04, finanza: 0.06, bigtech: 0.05, bench: 0.06}

# Rischio idiosincratico: probabilità annua per titolo di un crollo dell'80-100% in un giorno
idio_p_anno: 0.015
