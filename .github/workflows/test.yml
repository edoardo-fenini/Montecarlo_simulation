# Test automatici (senza internet: dati finti) su Linux, a ogni push e su ogni pull request verso main.
# Comprende il test di non regressione e i test della 1.2 (ISIN, controllo dati, app).
name: Test

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python -m pytest -q tests
