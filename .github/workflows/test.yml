# Test automatici (senza internet: dati finti) su Linux, a ogni push e su ogni pull request verso main.
# Comprende il test di non regressione, i test della 1.2 (ISIN, controllo dati, app) e dalla 1.3 la prova nel browser (tests/e2e).
name: Test

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:   # usato anche dal workflow «Release»

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-e2e.txt ruff
      - name: Browser per la prova dell'app (Chromium di Playwright)
        run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - name: Test (compresa la prova nel browser in tests/e2e, con dati finti e senza internet)
        run: python -m pytest -q tests
